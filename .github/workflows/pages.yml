name: Build and deploy proxy.pac

# Runs when you click "Run workflow" in the Actions tab,
# and automatically whenever the files in protonvpn-wireproxy/ or this file are edited on main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - protonvpn-wireproxy/domains.txt
      - protonvpn-wireproxy/index.html
      - .github/workflows/pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Folder in the repo that holds domains.txt and index.html.
  SRC_DIR: "protonvpn-wireproxy"
  # Your PC's LAN address and the wireproxy port. Edit if your PC's IP changes.
  PROXY_ADDR: "192.168.1.59:8118"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Generate proxy.pac from domains.txt
        run: |
          mkdir _site
          python3 - <<'EOF'
          import json, os, re

          src = os.environ["SRC_DIR"]
          proxy = os.environ["PROXY_ADDR"]
          domains = []
          for line in open(os.path.join(src, "domains.txt"), encoding="utf-8"):
              line = line.split("#", 1)[0].strip().lower()
              if not line:
                  continue
              if line.startswith("*."):
                  line = line[2:]
              if not re.fullmatch(r"[a-z0-9]([a-z0-9.-]*[a-z0-9])?", line):
                  raise SystemExit("Invalid domain in domains.txt: " + line)
              domains.append(line)

          template = """// Generated from domains.txt. Do not edit by hand.
          var domains = %DOMAINS%;

          function FindProxyForURL(url, host) {
            // wireproxy's HTTP proxy only supports HTTPS, so plain http goes direct
            if (url.substring(0, 6) !== "https:") return "DIRECT";

            host = host.toLowerCase();
            for (var i = 0; i < domains.length; i++) {
              var d = domains[i];
              if (host === d || shExpMatch(host, "*." + d))
                return "PROXY %PROXY%; DIRECT";
            }
            return "DIRECT";
          }
          """

          pac = template.replace("%DOMAINS%", json.dumps(domains)).replace("%PROXY%", proxy)
          open("_site/proxy.pac", "w", encoding="utf-8").write(pac)
          print("Wrote proxy.pac with", len(domains), "domains")
          EOF
          cp "$SRC_DIR/index.html" _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
